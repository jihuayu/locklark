name: 原生移动端
# Artifact names include the run attempt, which is only available to a run's
# own environment. This unique per-run run-name supplies it without a new job.
run-name: ${{ github.workflow }} · attempt ${{ github.run_attempt }}
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to the same PR supersedes its previous run. Main pushes keep
  # their own ref-scoped group and are not cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fixed Android build components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"'
      - name: Bind the real Go vault and build Android applications
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          mobile/core/scripts/bind-android.sh
          mobile/android/scripts/build.sh
          python3 -m unittest discover -s mobile/android/scripts -p test_runtime_wrapper.py
          python3 -m unittest discover -s mobile/android/scripts -p test_device_credential.py
          python3 -m unittest discover -s scripts -p test_mobile_android_acceptance.py
          go build -o "$RUNNER_TEMP/locklark-mobile-peer" ./cmd/locklark
          python3 -m venv "$RUNNER_TEMP/mobile-kdbx-peer"
          "$RUNNER_TEMP/mobile-kdbx-peer/bin/python" -m pip install 'pykeepass==4.2.0'
      # Receipt before any runtime step so it can only describe the APKs.
      - name: Record built APK receipt for reproduction
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/mobile-apk-receipt"
          install -d -m 700 "$receipt_dir"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$receipt_dir/app-debug.apk"
          android_test_apk="$(find mobile/android/app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*-androidTest.apk')"
          test -n "$android_test_apk"
          test "$(printf '%s\n' "$android_test_apk" | wc -l)" -eq 1
          cp "$android_test_apk" "$receipt_dir/app-debug-androidTest.apk"
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          tracked_modified=false
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then tracked_modified=true; fi
          {
            printf '{"checkout_sha":"%s",' "$head_sha"
            printf '"pull_request_head_sha":"%s",' "${PR_HEAD_SHA:-}"
            printf '"tracked_worktree_modified":%s,' "$tracked_modified"
            printf '"app_debug_apk_sha256":"%s",' "$(sha256sum "$receipt_dir/app-debug.apk" | cut -d ' ' -f 1)"
            printf '"app_debug_android_test_apk_sha256":"%s"}\n' "$(sha256sum "$receipt_dir/app-debug-androidTest.apk" | cut -d ' ' -f 1)"
          } > "$receipt_dir/apk-receipt.json"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Preserve built APKs and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-mobile-apk-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-apk-receipt/app-debug.apk
            ${{ runner.temp }}/mobile-apk-receipt/app-debug-androidTest.apk
            ${{ runner.temp }}/mobile-apk-receipt/apk-receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run native Android application acceptance
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          # ATD deliberately removes android.software.secure_lock_screen.
          # Real Keystore credential authentication requires the full image.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/mobile-android-runtime.sh
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build native iOS application and run simulator acceptance
        run: mobile/ios/scripts/ci.sh
