name: 原生移动端
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fixed Android build components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"'
      - name: Bind the real Go vault and build Android applications
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          mobile/core/scripts/bind-android.sh
          mobile/android/scripts/build.sh
          python3 -m unittest discover -s mobile/android/scripts -p test_runtime_wrapper.py
          python3 -m unittest discover -s scripts -p test_mobile_android_acceptance.py
          go build -o "$RUNNER_TEMP/locklark-mobile-peer" ./cmd/locklark
          python3 -m venv "$RUNNER_TEMP/mobile-kdbx-peer"
          "$RUNNER_TEMP/mobile-kdbx-peer/bin/python" -m pip install 'pykeepass==4.2.0'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run native Android application acceptance
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            ANDROID_SERIAL=emulator-5554 LOCKLARK_ANDROID_TEST_RESET=1 mobile/android/scripts/test-emulator.sh
            python3 scripts/mobile_android_acceptance.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --apk mobile/android/app/build/outputs/apk/debug/app-debug.apk --reset-test-app --cli "$RUNNER_TEMP/locklark-mobile-peer" --peer "$RUNNER_TEMP/mobile-kdbx-peer/bin/python"
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build native iOS application and run simulator acceptance
        run: mobile/ios/scripts/ci.sh
