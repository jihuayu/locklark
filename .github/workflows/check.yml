name: 检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun test ./plugins/github-pull-reader
      - run: python -m unittest discover -s scripts -p test_personal_windows.py
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./cmd/locklark-desktop
      - name: Build native browser hosts
        run: go build ./cmd/locklark-browser-chromium ./cmd/locklark-browser-firefox ./cmd/locklark-browser-register
      - shell: pwsh
        run: |
          $peerEnv = Join-Path $env:RUNNER_TEMP 'locklark-kdbx-peer'
          python -m venv $peerEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCKLARK_TEST_PYKEEPASS = Join-Path $peerEnv $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          & $env:LOCKLARK_TEST_PYKEEPASS -m pip install 'pykeepass==4.2.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCKLARK_TEST_BUN = (Get-Command bun -CommandType Application | Select-Object -First 1).Source
          go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: |
          go build -o "$RUNNER_TEMP/locklark" ./cmd/locklark
          python3 scripts/mcp_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/personal_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/disclosure_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/generation_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/otp_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/references_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/matching_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/archive_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/health_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/search_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/run_env_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/injection_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/live_pull_acceptance.py "$RUNNER_TEMP/locklark"
          python3 scripts/inspection_acceptance.py "$RUNNER_TEMP/locklark"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/trash_acceptance.py "$RUNNER_TEMP/locklark"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/import_acceptance.py "$RUNNER_TEMP/locklark"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/export_acceptance.py "$RUNNER_TEMP/locklark"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/plugin_acceptance.py "$RUNNER_TEMP/locklark"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/acceptance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:RUNNER_TEMP 'locklark-kdbx-peer/Scripts/python.exe'
          & $python -m pip install 'pywinpty==3.1.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $env:RUNNER_TEMP 'personal-cli.exe'
          go build -o $binary ./cmd/locklark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/personal_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/disclosure_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/generation_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/otp_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/references_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/inspection_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/matching_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/archive_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/health_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/search_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/run_env_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/injection_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/live_pull_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/trash_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/import_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/export_acceptance.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/plugin_acceptance.py $binary
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go build ./cmd/locklark-desktop
      - name: Build native browser hosts
        run: go build ./cmd/locklark-browser-chromium ./cmd/locklark-browser-firefox ./cmd/locklark-browser-register
      - run: go test ./internal/osunlock ./internal/desktop ./internal/personal -run 'TestNative|TestDesktopSession|TestSystemUnlock|TestLockDoesNotWait|TestCancelledSystemUnlock|TestLockDrops|TestClipboard' -count=1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test browser extension
        timeout-minutes: 10
        run: node --test browser-extension/test/*.test.js
      - run: npm ci
        working-directory: web
      - run: npm test && npm run typecheck && npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Configure Ubuntu package downloads
        run: |
          # GitHub's mirror lists can prefer the slow Azure HTTP mirror.
          sources=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt)
          for source in "${sources[@]}"; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's@http://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@https://archive.ubuntu.com/ubuntu\1@g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' |
            sudo tee /etc/apt/apt.conf.d/99locklark-playwright-network >/dev/null
      - name: Install Playwright browsers and dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          LOCKLARK_TEST_BROWSER: firefox
      - name: Install native browser acceptance tools
        timeout-minutes: 10
        run: sudo apt-get install -y --no-install-recommends libxtst6 xvfb xauth imagemagick at-spi2-core libatspi2.0-0 libnss3-tools
      - name: Install pinned geckodriver
        timeout-minutes: 10
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/geckodriver.tar.gz" https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          printf '%s  %s\n' '0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04' "$RUNNER_TEMP/geckodriver.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
      - name: Build native hosts for browser acceptance
        timeout-minutes: 10
        run: |
          go build -o "$RUNNER_TEMP/locklark-browser-chromium" ./cmd/locklark-browser-chromium
          go build -o "$RUNNER_TEMP/locklark-browser-firefox" ./cmd/locklark-browser-firefox
          go build -o "$RUNNER_TEMP/locklark-browser-register" ./cmd/locklark-browser-register
      - name: Test browser extension DOM
        timeout-minutes: 10
        run: node scripts/browser_extension_dom.cjs
        env:
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
      - name: Test native browser approval and fill
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_native_acceptance.mjs
        env:
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_GO: go
          LOCKLARK_BROWSER_HOST: ${{ runner.temp }}/locklark-browser-chromium
      - name: Test Firefox native browser approval and fill
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_firefox_native_acceptance.mjs
        env:
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_GO: go
          LOCKLARK_BROWSER_HOST: ${{ runner.temp }}/locklark-browser-firefox
          LOCKLARK_BROWSER_REGISTER: ${{ runner.temp }}/locklark-browser-register
          LOCKLARK_GECKODRIVER: ${{ runner.temp }}/geckodriver
