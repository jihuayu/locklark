name: 检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to the same PR supersedes its previous run. Main pushes keep
  # their own ref-scoped group and are not cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build CLI and primary artifacts once
        timeout-minutes: 10
        run: |
          bin="$RUNNER_TEMP/locklark-bin"
          mkdir -p "$bin"
          go build -trimpath -o "$bin/locklark" ./cmd/locklark
          go build -trimpath -o "$bin/locklark-desktop" ./cmd/locklark-desktop
          go build -trimpath -o "$bin/locklark-browser-chromium" ./cmd/locklark-browser-chromium
          go build -trimpath -o "$bin/locklark-browser-firefox" ./cmd/locklark-browser-firefox
          go build -trimpath -o "$bin/locklark-browser-register" ./cmd/locklark-browser-register
          go build -trimpath -o "$bin/locklark-team-sync" ./cmd/locklark-team-sync
          go build -trimpath -o "$bin/desktop-acceptance-fixture" ./scripts/desktop_acceptance_fixture
          go build -trimpath -o "$bin/browser-acceptance-fixture" ./scripts/browser_acceptance_fixture
      - name: Smoke test real CLI before acceptance
        run: python3 scripts/cli_smoke.py --cli "$RUNNER_TEMP/locklark-bin/locklark"
      - name: Test smoke failure paths
        run: python3 -m unittest discover -s scripts -p test_cli_smoke.py
      - name: Preserve Linux primary binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-linux-bin
          path: ${{ runner.temp }}/locklark-bin/
          if-no-files-found: error
          retention-days: 14
  go:
    needs: [linux-build]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Download Linux primary binaries
        if: runner.os == 'Linux'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: locklark-linux-bin
          path: ${{ runner.temp }}/locklark-bin
      - name: Make Linux binaries executable
        if: runner.os == 'Linux'
        run: chmod +x "$RUNNER_TEMP"/locklark-bin/*
      - name: Build CLI and primary artifacts once
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'locklark-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          foreach ($target in @(
            @('locklark.exe', './cmd/locklark'),
            @('locklark-desktop.exe', './cmd/locklark-desktop'),
            @('locklark-browser-chromium.exe', './cmd/locklark-browser-chromium'),
            @('locklark-browser-firefox.exe', './cmd/locklark-browser-firefox'),
            @('locklark-browser-register.exe', './cmd/locklark-browser-register')
          )) {
            go build -trimpath -o (Join-Path $bin $target[0]) $target[1]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Smoke test downloaded CLI before acceptance
        if: runner.os == 'Linux'
        run: python3 scripts/cli_smoke.py --cli "$RUNNER_TEMP/locklark-bin/locklark"
      - name: Smoke test real CLI before acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/cli_smoke.py --cli (Join-Path $env:RUNNER_TEMP 'locklark-bin/locklark.exe')
      - run: bun test ./plugins/github-pull-reader
      - run: python -m unittest discover -s scripts -p test_personal_windows.py
      - run: python -m unittest discover -s scripts -p test_run_cli_windows_acceptance.py
      - run: go mod verify
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./... > "$RUNNER_TEMP/locklark-govulncheck.json"
      - name: Preserve Go vulnerability scan
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-go-vulnerability-scan
          path: ${{ runner.temp }}/locklark-govulncheck.json
          if-no-files-found: error
          retention-days: 14
      - name: Test native Windows clipboard ownership
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          LOCKLARK_TEST_NATIVE_CLIPBOARD: '1'
        run: go test ./internal/nativeclipboard -run TestNativeClipboardSmoke -count=1
      - name: Test Go packages and native OpenSSH transport
        shell: pwsh
        env:
          LOCKLARK_TEST_OPENSSH: '1'
        run: |
          $env:LOCKLARK_TEST_OPENSSH_BIN = if ($IsWindows) { Join-Path $env:WINDIR 'System32/OpenSSH/ssh-add.exe' } else { '/usr/bin/ssh-add' }
          if (-not (Test-Path -LiteralPath $env:LOCKLARK_TEST_OPENSSH_BIN -PathType Leaf)) { throw 'Native system OpenSSH client unavailable' }
          if ($IsWindows) {
            foreach ($name in @('ssh-add.exe', 'ssh.exe')) {
              $nativeClient = Join-Path $env:WINDIR "System32/OpenSSH/$name"
              $info = (Get-Item -LiteralPath $nativeClient).VersionInfo
              $version = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
              if ($version -notmatch '^[0-9]+(?:\.[0-9]+){3}$' -or $version -eq '0.0.0.0') { $version = 'unrecognized' }
              Write-Output "Native Windows $name file version: $version"
            }
          }
          $peerEnv = Join-Path $env:RUNNER_TEMP 'locklark-kdbx-peer'
          python -m venv $peerEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCKLARK_TEST_PYKEEPASS = Join-Path $peerEnv $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          & $env:LOCKLARK_TEST_PYKEEPASS -m pip install 'pykeepass==4.2.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCKLARK_TEST_BUN = (Get-Command bun -CommandType Application | Select-Object -First 1).Source
          go test -count=1 ./...
      - if: runner.os == 'Linux'
        env:
          LOCKLARK_CLI: ${{ runner.temp }}/locklark-bin/locklark
        run: |
          python3 scripts/team_sync_acceptance.py --go "$(command -v go)"
          python3 scripts/mcp_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/personal_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/disclosure_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/generation_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/otp_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/references_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/matching_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/archive_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/health_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/search_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/run_env_acceptance.py "$LOCKLARK_CLI"
          python3 -m unittest discover -s scripts -p test_run_cli_acceptance.py
          /usr/bin/gh --version
          python3 scripts/run_cli_acceptance.py --cli "$LOCKLARK_CLI" --go "$(command -v go)" --artifacts "$RUNNER_TEMP/locklark-run-cli-evidence"
          python3 scripts/injection_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/live_pull_acceptance.py "$LOCKLARK_CLI"
          python3 scripts/inspection_acceptance.py "$LOCKLARK_CLI"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/trash_acceptance.py "$LOCKLARK_CLI"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/import_acceptance.py "$LOCKLARK_CLI"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/export_acceptance.py "$LOCKLARK_CLI"
          "$RUNNER_TEMP/locklark-kdbx-peer/bin/python" scripts/plugin_acceptance.py "$LOCKLARK_CLI"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOCKLARK_CLI: ${{ runner.temp }}/locklark-bin/locklark.exe
        run: |
          ./scripts/acceptance.ps1 -Cli $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:RUNNER_TEMP 'locklark-kdbx-peer/Scripts/python.exe'
          & $python -m pip install 'pywinpty==3.1.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/personal_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/disclosure_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/generation_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/otp_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/references_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/inspection_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/matching_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/archive_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/health_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/search_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/run_env_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/injection_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/live_pull_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/trash_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/import_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/export_acceptance.py $env:LOCKLARK_CLI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/plugin_acceptance.py $env:LOCKLARK_CLI
      - name: Benchmark authenticated audit history verification
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: go test ./internal/personal -run '^$' -bench '^BenchmarkAuditCache' -benchmem -benchtime=3x -count=1
      - name: Test native Windows RunCLI console and piped standard streams
        if: always() && runner.os == 'Windows' && !cancelled()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $peerEnv = Join-Path $env:RUNNER_TEMP 'locklark-kdbx-peer'
          $python = Join-Path $peerEnv 'Scripts/python.exe'
          $binary = Join-Path $env:RUNNER_TEMP 'locklark-bin/locklark.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'run-cli-windows-fixture.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            python -m venv $peerEnv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $python -m pip install 'pywinpty==3.1.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Prebuilt CLI missing' }
          go build -o $fixture ./scripts/run_cli_windows_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/run_cli_windows_acceptance.py --cli $binary --fixture-bin $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Build primary artifacts once
        run: |
          bin="$RUNNER_TEMP/locklark-bin"
          mkdir -p "$bin"
          go build -trimpath -o "$bin/locklark-desktop" ./cmd/locklark-desktop
          go build -trimpath -o "$bin/locklark-browser-chromium" ./cmd/locklark-browser-chromium
          go build -trimpath -o "$bin/locklark-browser-firefox" ./cmd/locklark-browser-firefox
          go build -trimpath -o "$bin/locklark-browser-register" ./cmd/locklark-browser-register
      - name: Test Safari transport policy and compile the macOS app
        timeout-minutes: 15
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          safari/scripts/test_safari_swift.sh
          go build -o "$RUNNER_TEMP/locklark-browser-safari" ./cmd/locklark-browser-safari
          LOCKLARK_UNSIGNED_CI=1 LOCKLARK_SAFARI_HELPER="$RUNNER_TEMP/locklark-browser-safari" safari/scripts/build_safari.sh
          echo 'Safari source compiled; signed installation and Safari runtime acceptance remain unverified.'
      - run: go test ./internal/osunlock ./internal/desktop ./internal/personal ./internal/browserhost ./internal/vault ./internal/onepux -run 'TestNative|TestDesktopSession|TestSystemUnlock|TestLockDoesNotWait|TestCancelledSystemUnlock|TestLockDrops|TestClipboard|TestDaily|TestBrowserOTP|TestOTP|TestQuick|TestNotes|TestLoginNotes' -count=1
      - name: Test full browser host on macOS
        timeout-minutes: 10
        env:
          # Keep Unix socket paths under the 104-byte Darwin limit. Runner
          # TMPDIRs plus long test names previously produced bind EINVAL.
          TMPDIR: /tmp
        run: go test ./internal/browserhost -count=1
      - name: Test native macOS clipboard ownership
        timeout-minutes: 3
        env:
          LOCKLARK_TEST_NATIVE_CLIPBOARD: '1'
        run: go test ./internal/nativeclipboard -count=1
      - name: Test native macOS SSH transport and RunCLI isolation
        timeout-minutes: 5
        env:
          LOCKLARK_TEST_OPENSSH: '1'
          LOCKLARK_TEST_OPENSSH_BIN: /usr/bin/ssh-add
        run: |
          test -x "$LOCKLARK_TEST_OPENSSH_BIN"
          go test ./internal/sshagent ./internal/localpath -count=1
          go test ./internal/personal ./cmd/locklark -run '^TestRunCLI' -count=1
  web-core:
    needs: [linux-build]
    runs-on: ubuntu-latest
    env:
      LOCKLARK_DESKTOP_LAYOUT: classic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download Linux primary binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: locklark-linux-bin
          path: ${{ runner.temp }}/locklark-bin
      - name: Make Linux binaries executable
        run: chmod +x "$RUNNER_TEMP"/locklark-bin/*
      - name: Smoke test downloaded CLI before acceptance
        run: python3 scripts/cli_smoke.py --cli "$RUNNER_TEMP/locklark-bin/locklark"
      - name: Test browser extension
        timeout-minutes: 10
        run: node --test browser-extension/test/*.test.js scripts/test_browser_checkout_acceptance.mjs scripts/test_browser_accessibility_acceptance.mjs scripts/test_browser_fixture_path.mjs
      - name: Prepare reproducible unsigned extension packages
        timeout-minutes: 5
        run: |
          python3 -m pip install -r scripts/browserrelease/requirements.txt
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/browserrelease/tests -t scripts
          python3 scripts/test_package_browser_extension.py
          python3 scripts/package_browser_extension.py --product chromium --output "$RUNNER_TEMP/locklark-extension-unsigned"
          node --test scripts/test_browser_edge_install.mjs
          python3 scripts/package_browser_extension.py --product firefox --output "$RUNNER_TEMP/locklark-extension-unsigned"
          for product in chromium firefox safari; do
            PYTHONPATH=scripts python3 -m browserrelease --product "$product" --output "$RUNNER_TEMP/locklark-extension-verified"
            PYTHONPATH=scripts python3 -m browserrelease --verify --product "$product" --output "$RUNNER_TEMP/locklark-extension-verified"
          done
      - name: Preserve unsigned extension preparation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-extension-unsigned-preparation
          path: |
            ${{ runner.temp }}/locklark-extension-unsigned/
            ${{ runner.temp }}/locklark-extension-verified/
          if-no-files-found: error
          retention-days: 14
      - name: Test native acceptance readiness and reference cleanup
        timeout-minutes: 1
        run: python3 -m unittest discover -s scripts -p 'test_*native*.py'
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high && npm test && npm run typecheck && npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Configure Ubuntu package downloads
        run: |
          # GitHub's mirror lists can prefer the slow Azure HTTP mirror.
          sources=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt)
          for source in "${sources[@]}"; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's@http://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@https://archive.ubuntu.com/ubuntu\1@g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' |
            sudo tee /etc/apt/apt.conf.d/99locklark-playwright-network >/dev/null
      - name: Install Playwright browsers and dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          LOCKLARK_TEST_BROWSER: firefox
      - name: Install native GUI acceptance tools
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends libxtst6 xvfb xauth imagemagick at-spi2-core libatspi2.0-0 libnss3-tools xfwm4 openssh-client openssh-server
          sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Test reconciled E2E gates and component contracts
        timeout-minutes: 10
        run: |
          python3 -m unittest discover -s tests/scripts -p 'test_e2e*.py'
          python3 -m unittest discover -s scripts -p test_browser_firefox_native_passkey.py
          python3 -m unittest scripts/test_native_acceptance_contract.py scripts/test_native_acceptance_platforms.py scripts/test_safari_package.py
          # GUI probes create their own D-Bus/Xvfb session; avoid inherited
          # runner displays or buses from earlier browser steps.
          env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS python3 scripts/e2e_runner.py \
            --feature all --skip-build --bin-dir "$RUNNER_TEMP/locklark-bin" \
            --json-out "$RUNNER_TEMP/locklark-e2e-report.json"
      - name: Preserve E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-e2e-report
          path: ${{ runner.temp }}/locklark-e2e-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test native desktop daily tools and clipboard ownership
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/desktop_native_acceptance.py
        env:
          LOCKLARK_GO: go
          LOCKLARK_DESKTOP_HOST: ${{ runner.temp }}/locklark-bin/locklark-desktop
          LOCKLARK_DESKTOP_FIXTURE: ${{ runner.temp }}/locklark-bin/desktop-acceptance-fixture
      - name: Test native desktop global quick search
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/desktop_quick_search_acceptance.py
        env:
          LOCKLARK_GO: go
          LOCKLARK_DESKTOP_HOST: ${{ runner.temp }}/locklark-bin/locklark-desktop
          LOCKLARK_DESKTOP_FIXTURE: ${{ runner.temp }}/locklark-bin/desktop-acceptance-fixture
      - name: Install independent notes KDBX reader
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/locklark-notes-peer"
          "$RUNNER_TEMP/locklark-notes-peer/bin/python" -m pip install 'pykeepass==4.2.0'
      - name: Test native imported multiline login notes and failure privacy
        timeout-minutes: 10
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/desktop_login_notes_acceptance.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/login_notes_privacy_acceptance.py
        env:
          LOCKLARK_GO: go
          LOCKLARK_CLI_HOST: ${{ runner.temp }}/locklark-bin/locklark
          LOCKLARK_DESKTOP_HOST: ${{ runner.temp }}/locklark-bin/locklark-desktop
          LOCKLARK_DESKTOP_FIXTURE: ${{ runner.temp }}/locklark-bin/desktop-acceptance-fixture
          LOCKLARK_TEST_PYKEEPASS: ${{ runner.temp }}/locklark-notes-peer/bin/python
      - name: Test native SSH approvals, real OpenSSH forwarding and encrypted export
        timeout-minutes: 10
        run: |
          python3 -m unittest discover -s scripts -p test_ssh_agent_acceptance.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x2160x24 -nolisten tcp' python3 scripts/ssh_agent_acceptance.py \
            --host "$RUNNER_TEMP/locklark-bin/locklark-desktop" --cli "$RUNNER_TEMP/locklark-bin/locklark" --go "$(command -v go)" \
            --peer "$RUNNER_TEMP/locklark-notes-peer/bin/python" --window-manager /usr/bin/xfwm4 \
            --artifacts "$RUNNER_TEMP/locklark-ssh-evidence"
      - name: Test browser extension DOM
        timeout-minutes: 10
        run: |
          node scripts/browser_extension_dom.cjs
          node scripts/browser_public_site_compatibility.cjs
          node scripts/browser_popup_ui_acceptance.cjs
        env:
          LOCKLARK_TEST_UI_ARTIFACTS: ${{ runner.temp }}/locklark-ui-acceptance
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
      - name: Test Firefox browser extension DOM
        timeout-minutes: 10
        run: |
          node scripts/browser_extension_dom.cjs
          node scripts/browser_public_site_compatibility.cjs
          node scripts/browser_popup_ui_acceptance.cjs
        env:
          LOCKLARK_TEST_UI_ARTIFACTS: ${{ runner.temp }}/locklark-ui-acceptance
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_TEST_BROWSER: firefox
      - name: Preserve synthetic popup UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-synthetic-popup-ui
          path: ${{ runner.temp }}/locklark-ui-acceptance/
          if-no-files-found: error
          retention-days: 14
  web-browsers:
    needs: [linux-build]
    runs-on: ubuntu-latest
    env:
      LOCKLARK_DESKTOP_LAYOUT: classic
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download Linux primary binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: locklark-linux-bin
          path: ${{ runner.temp }}/locklark-bin
      - name: Make Linux binaries executable
        run: chmod +x "$RUNNER_TEMP"/locklark-bin/*
      - run: npm ci
        working-directory: web
      - name: Configure Ubuntu package downloads
        run: |
          # GitHub's mirror lists can prefer the slow Azure HTTP mirror.
          sources=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt)
          for source in "${sources[@]}"; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's@http://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)@https://archive.ubuntu.com/ubuntu\1@g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' |
            sudo tee /etc/apt/apt.conf.d/99locklark-playwright-network >/dev/null
      - name: Install Playwright browser and dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web
      - name: Install native GUI acceptance tools
        timeout-minutes: 10
        run: sudo apt-get install -y --no-install-recommends libxtst6 xvfb dbus-x11 xauth imagemagick at-spi2-core libatspi2.0-0 libnss3-tools
      - name: Install pinned geckodriver
        if: ${{ matrix.browser == 'firefox' }}
        timeout-minutes: 10
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/geckodriver.tar.gz" https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          printf '%s  %s\n' '0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04' "$RUNNER_TEMP/geckodriver.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
      - name: Install independent WebAuthn verifier
        timeout-minutes: 3
        run: npm install --prefix "$RUNNER_TEMP/locklark-webauthn-peer" --ignore-scripts --no-audit --no-fund @simplewebauthn/server@14.0.3
      - name: Test native browser approval, popup editing, fill, save and OTP
        if: ${{ matrix.browser == 'chromium' }}
        timeout-minutes: 15
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_native_acceptance.mjs
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/browser_otp_privacy_acceptance.py chromium
          # The route checkpoint is a separate mode that refuses the step-level
          # popup-vault override, so clear only that override for this run.
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' env -u LOCKLARK_TEST_POPUP_VAULT LOCKLARK_TEST_ROUTE_DETAIL_READ=1 LOCKLARK_TEST_ROUTE_IDLE_TTL=1 node scripts/browser_native_acceptance.mjs
        env:
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_TEST_WEBAUTHN_SERVER: ${{ runner.temp }}/locklark-webauthn-peer/node_modules/@simplewebauthn/server
          LOCKLARK_GO: go
          LOCKLARK_BROWSER_HOST: ${{ runner.temp }}/locklark-bin/locklark-browser-${{ matrix.browser }}
          LOCKLARK_BROWSER_REGISTER: ${{ runner.temp }}/locklark-bin/locklark-browser-register
          LOCKLARK_BROWSER_FIXTURE: ${{ runner.temp }}/locklark-bin/browser-acceptance-fixture
          LOCKLARK_TEST_POPUP_VAULT: "1"
          LOCKLARK_TEST_PASSKEY_MANAGEMENT: "1"
          LOCKLARK_TEST_PASSKEY_CONDITIONAL: "1"
          LOCKLARK_TEST_OTHER_PROVIDER: "1"
          LOCKLARK_TEST_PASSKEY_SIGNALS: "1"
      - name: Test normal-runner checkout acceptance on Chromium
        if: ${{ matrix.browser == 'chromium' }}
        # The native journey enforces a 900s budget and wraps itself in
        # dbus-run-session/xvfb-run, so only the runner gets an outer timeout.
        timeout-minutes: 20
        run: |
          python3 scripts/e2e_runner.py --id T2_F11_06 --skip-build --strict \
            --bin-dir "$RUNNER_TEMP/locklark-bin" \
            --json-out "$RUNNER_TEMP/locklark-checkout-e2e-report.json"
          test -s "$RUNNER_TEMP/locklark-checkout-e2e-report.json"
          test -s "$RUNNER_TEMP/locklark-checkout-evidence.json"
        env:
          LOCKLARK_E2E_CHECKOUT_NATIVE: '1'
          LOCKLARK_E2E_CHECKOUT_EVIDENCE_OUT: ${{ runner.temp }}/locklark-checkout-evidence.json
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_GO: go
      - name: Preserve checkout acceptance report and evidence
        if: ${{ always() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locklark-checkout-acceptance
          path: |
            ${{ runner.temp }}/locklark-checkout-e2e-report.json
            ${{ runner.temp }}/locklark-checkout-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test Firefox native approval, fill, save, OTP and Passkey
        if: ${{ matrix.browser == 'firefox' }}
        timeout-minutes: 10
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_firefox_native_acceptance.mjs
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/browser_otp_privacy_acceptance.py firefox
        env:
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_GO: go
          LOCKLARK_BROWSER_HOST: ${{ runner.temp }}/locklark-bin/locklark-browser-${{ matrix.browser }}
          LOCKLARK_BROWSER_REGISTER: ${{ runner.temp }}/locklark-bin/locklark-browser-register
          LOCKLARK_BROWSER_FIXTURE: ${{ runner.temp }}/locklark-bin/browser-acceptance-fixture
          LOCKLARK_GECKODRIVER: ${{ runner.temp }}/geckodriver
          LOCKLARK_TEST_FIREFOX_PASSKEY: "1"
          LOCKLARK_TEST_PASSKEY_MANAGEMENT: "1"
          LOCKLARK_TEST_PASSKEY_CONDITIONAL: "1"
          LOCKLARK_TEST_WEBAUTHN_SERVER: ${{ runner.temp }}/locklark-webauthn-peer/node_modules/@simplewebauthn/server
      - name: Test shared desktop clipboard lease
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.browser }}" = firefox ]; then
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_firefox_native_acceptance.mjs
          else
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' node scripts/browser_native_acceptance.mjs
          fi
        env:
          LOCKLARK_TEST_SHARED_CLIPBOARD: "1"
          LOCKLARK_TEST_PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright
          LOCKLARK_GO: go
          LOCKLARK_BROWSER_HOST: ${{ runner.temp }}/locklark-bin/locklark-browser-${{ matrix.browser }}
          LOCKLARK_BROWSER_REGISTER: ${{ runner.temp }}/locklark-bin/locklark-browser-register
          LOCKLARK_BROWSER_FIXTURE: ${{ runner.temp }}/locklark-bin/browser-acceptance-fixture
          LOCKLARK_DESKTOP_HOST: ${{ runner.temp }}/locklark-bin/locklark-desktop
          LOCKLARK_GECKODRIVER: ${{ runner.temp }}/geckodriver
          LOCKLARK_TEST_WEBAUTHN_SERVER: ${{ runner.temp }}/locklark-webauthn-peer/node_modules/@simplewebauthn/server
  web:
    name: web
    needs: [web-core, web-browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Web check to succeed
        env:
          WEB_CORE_RESULT: ${{ needs.web-core.result }}
          WEB_BROWSERS_RESULT: ${{ needs.web-browsers.result }}
        run: |
          if [ "$WEB_CORE_RESULT" != success ] || [ "$WEB_BROWSERS_RESULT" != success ]; then
            echo "web-core=$WEB_CORE_RESULT web-browsers=$WEB_BROWSERS_RESULT"
            exit 1
          fi
