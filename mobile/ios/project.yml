name: Locklark
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  LocklarkSecurityLogic:
    path: SecurityLogic
targets:
  Locklark:
    type: application
    platform: iOS
    sources:
      - Locklark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.locklark.mobile.ios
        PRODUCT_NAME: Locklark
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Locklark/Locklark-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Locklark/Locklark.entitlements
        CLANG_ENABLE_OBJC_ARC: YES
        INFOPLIST_KEY_CFBundleDisplayName: Locklark
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用系统验证解锁此设备上已明确启用的本机快速解锁。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - framework: Build/Mobilecore.xcframework
        embed: false
      - package: LocklarkSecurityLogic
  LocklarkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocklarkTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.locklark.mobile.ios.tests
        SWIFT_OBJC_BRIDGING_HEADER: Locklark/Locklark-Bridging-Header.h
    dependencies:
      - target: Locklark
      - package: LocklarkSecurityLogic
  LocklarkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocklarkUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.locklark.mobile.ios.uitests
    dependencies:
      - target: Locklark
schemes:
  Locklark:
    build:
      targets:
        Locklark: all
    test:
      targets: [LocklarkTests, LocklarkUITests]
      gatherCoverageData: false
