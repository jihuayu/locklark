name: Passme
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    PASSME_BUNDLE_BASE: org.passme.mobile.ios
packages:
  PassmeSecurityLogic:
    path: SecurityLogic
targets:
  Passme:
    type: application
    platform: iOS
    sources:
      - Passme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSME_BUNDLE_BASE)
        PRODUCT_NAME: Passme
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Passme/Passme-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Passme/Passme.entitlements
        CLANG_ENABLE_OBJC_ARC: YES
        INFOPLIST_KEY_CFBundleDisplayName: Passme
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用系统验证解锁此设备上已明确启用的本机快速解锁。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - framework: Build/Mobilecore.xcframework
        embed: false
      - package: PassmeSecurityLogic
  PassmeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PassmeTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSME_BUNDLE_BASE).tests
        SWIFT_OBJC_BRIDGING_HEADER: Passme/Passme-Bridging-Header.h
    dependencies:
      - target: Passme
      - package: PassmeSecurityLogic
  PassmeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PassmeUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSME_BUNDLE_BASE).uitests
    dependencies:
      - target: Passme
  PassmeCapabilityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PassmeCapabilityTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSME_BUNDLE_BASE).capabilitytests
        SWIFT_OBJC_BRIDGING_HEADER: Passme/Passme-Bridging-Header.h
    dependencies:
      - target: Passme
      - package: PassmeSecurityLogic
  PassmeCapabilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PassmeCapabilityUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSME_BUNDLE_BASE).capabilityuitests
    dependencies:
      - target: Passme
schemes:
  Passme:
    build:
      targets:
        Passme: all
    test:
      targets: [PassmeTests, PassmeUITests]
      gatherCoverageData: false
  PassmeCapabilityDenial:
    build:
      targets:
        Passme: all
    test:
      targets: [PassmeCapabilityTests, PassmeCapabilityUITests]
      gatherCoverageData: false
