<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Locklark</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <main>
      <h1>Locklark</h1>
      <p>当前网站登录</p>
      <div class="actions">
        <button id="connect">连接原生金库</button
        ><button id="refresh">读取当前网站候选</button
        ><button id="save-new">保存当前登录</button
        ><button id="cancel-otp" disabled>取消本次验证码</button
        ><button id="disconnect">断开</button>
      </div>
      <p id="status" role="status"></p>
      <p id="save-warning" class="note" role="alert"></p>
      <p id="origin"></p>
      <div id="candidates"></div>
      <p class="note">
        在原生窗口解锁、配对并逐次批准。分别批准登录或验证码填充，不自动提交。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
