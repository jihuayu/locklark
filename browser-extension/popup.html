<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Locklark</title
  ><link rel="stylesheet" href="popup.css" />
  <body data-vault="1" data-view="locked">
    <main>
      <header class="popup-header">
        <div>
          <h1>Locklark</h1>
          <p class="subtitle">当前网站登录</p>
        </div>
        <div class="header-actions">
          <button id="lock-btn" type="button" title="立即锁定 (Ctrl+Shift+L)">
            锁定
          </button>
          <button id="options-btn" type="button">设置</button>
        </div>
      </header>

      <div class="actions">
        <button id="connect">连接原生金库</button
        ><button id="refresh">读取当前网站候选</button
        ><button id="save-new">保存当前登录</button
        ><button id="cancel-otp" disabled>取消本次验证码</button
        ><button id="disconnect">断开</button>
      </div>
      <label
        ><input id="auto-login" type="checkbox" /> 选择账号后自动登录</label
      >
      <details>
        <summary>Passkey 设置</summary>
        <label
          ><input id="passkey-save" type="checkbox" /> 提供保存 Passkey</label
        ><label
          ><input id="passkey-use" type="checkbox" /> 提供 Passkey 登录</label
        >
      </details>
      <p id="status" role="status"></p>
      <p id="save-warning" class="note" role="alert"></p>
      <p id="origin"></p>
      <div id="candidates"></div>

      <section id="locked-view" class="locked-view" hidden>
        <p class="note">解锁后可搜索、查看和编辑完整金库。</p>
        <div class="actions">
          <button id="unlock-connect" type="button">连接并解锁原生金库</button>
          <button id="open-options" type="button">扩展设置</button>
        </div>
      </section>

      <section id="vault-view" class="vault-view" hidden>
        <div class="vault-toolbar">
          <input
            id="search-input"
            type="search"
            placeholder="搜索金库（标题、账号、网址、标签）…"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索金库"
          />
          <button id="search-clear" type="button" title="清除搜索">
            清除
          </button>
          <button id="new-item-btn" type="button" aria-expanded="false">
            + 新建
          </button>
        </div>
        <div id="new-item-menu" class="menu" hidden>
          <button type="button" data-category="login">登录</button>
          <button type="button" data-category="password">密码</button>
          <button type="button" data-category="note">安全备注</button>
          <button type="button" data-category="identity">身份信息</button>
          <button type="button" data-category="card">银行卡</button>
        </div>
        <div id="filter-tabs" class="filter-tabs" role="tablist">
          <button type="button" data-filter="suggested" role="tab">
            当前网站
          </button>
          <button type="button" data-filter="all" role="tab">全部</button>
          <button type="button" data-filter="favorites" role="tab">收藏</button>
          <button type="button" data-filter="login" role="tab">登录</button>
          <button type="button" data-filter="identity" role="tab">身份</button>
          <button type="button" data-filter="credit_card" role="tab">
            银行卡
          </button>
          <button type="button" data-filter="secure_note" role="tab">
            安全备注
          </button>
        </div>
        <p id="vault-count" class="vault-count"></p>
        <div id="vault-list" class="vault-list"></div>
        <p id="vault-empty" class="note" hidden>暂无条目</p>
        <fieldset id="site-controls" class="site-controls">
          <legend>此网站设置</legend>
          <label
            ><input id="site-disable-inline" type="checkbox" />
            在此网站禁用内联菜单</label
          >
          <label
            ><input id="site-never-save" type="checkbox" />
            在此网站从不提示保存</label
          >
        </fieldset>
      </section>

      <section id="detail-view" class="detail-view" hidden>
        <div class="pane-header">
          <button id="detail-back" type="button">← 返回</button>
          <span id="detail-category" class="badge"></span>
          <button
            id="detail-favorite"
            type="button"
            aria-pressed="false"
            title="收藏"
          >
            ☆
          </button>
          <button id="detail-edit" type="button">编辑</button>
        </div>
        <h2 id="detail-title"></h2>
        <p id="detail-unavailable" class="note" hidden></p>
        <div class="detail-actions">
          <button id="detail-fill" type="button">填充到此页面</button>
          <button id="detail-otp" type="button">填充验证码</button>
          <button id="detail-open-fill" type="button">打开并填充</button>
          <button id="detail-trash" type="button">移至废纸篓</button>
        </div>
        <div id="detail-fields" class="detail-fields"></div>
        <h3>网站</h3>
        <div id="detail-urls" class="detail-urls"></div>
        <h3>备注</h3>
        <p id="detail-notes" class="detail-notes"></p>
        <div id="detail-tags" class="tags"></div>
        <p id="detail-updated" class="note"></p>
      </section>

      <section id="editor-view" class="editor-view" hidden>
        <div class="pane-header">
          <button id="editor-back" type="button">← 返回</button>
          <h2 id="editor-heading">新建条目</h2>
        </div>
        <div id="editor-fields" class="editor-fields"></div>
        <div id="editor-custom-fields" class="custom-fields"></div>
        <button id="editor-add-custom" type="button">+ 自定义字段</button>
        <div class="editor-actions">
          <button id="editor-generate" type="button">生成密码</button>
          <button id="editor-save" type="button">保存</button>
          <button id="editor-cancel" type="button">取消</button>
        </div>
      </section>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>
      <p class="note">
        在原生窗口连接并启用快捷填充后，可直接在网页选择账号。自动登录只提交可明确识别的登录表单；Passkey
        需在原生窗口确认。
      </p>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
