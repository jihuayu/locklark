<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Locklark</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <main>
      <h1>Locklark</h1>
      <p>当前网站登录</p>
      <div class="actions">
        <button id="connect">连接原生金库</button
        ><button id="refresh">读取当前网站候选</button
        ><button id="save-new">保存当前登录</button
        ><button id="cancel-otp" disabled>取消本次验证码</button
        ><button id="disconnect">断开</button>
      </div>
      <label
        ><input id="auto-login" type="checkbox" /> 选择账号后自动登录</label
      >
      <details>
        <summary>Passkey 设置</summary>
        <label
          ><input id="passkey-save" type="checkbox" /> 提供保存 Passkey</label
        ><label
          ><input id="passkey-use" type="checkbox" /> 提供 Passkey 登录</label
        >
      </details>
      <p id="status" role="status"></p>
      <p id="save-warning" class="note" role="alert"></p>
      <p id="origin"></p>
      <div id="candidates"></div>
      <p class="note">
        在原生窗口连接并启用快捷填充后，可直接在网页选择账号。自动登录只提交可明确识别的登录表单；Passkey
        需在原生窗口确认。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
