<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Locklark</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <main>
      <div id="pending-save-banner" class="card pending" hidden>
        <p id="pending-save-mode" class="card-title"></p>
        <p id="pending-save-origin" class="note"></p>
        <p id="pending-save-username" class="note mono"></p>
        <label
          >标题<input
            id="pending-save-title"
            type="text"
            maxlength="1024"
            autocomplete="off"
        /></label>
        <div class="actions">
          <button id="commit-staged-save">保存登录</button
          ><button id="dismiss-staged-save">忽略</button
          ><button id="never-save-origin">此网站永不保存</button>
        </div>
      </div>
      <h1>Locklark</h1>
      <p>当前网站登录</p>
      <div class="actions">
        <button id="connect">连接原生金库</button
        ><button id="refresh">读取当前网站候选</button
        ><button id="save-new">保存当前登录</button
        ><button id="cancel-otp" disabled>取消本次验证码</button
        ><button id="disconnect">断开</button>
      </div>
      <label
        ><input id="auto-login" type="checkbox" /> 选择账号后自动登录</label
      >
      <label
        ><input id="offer-save-logins" type="checkbox" />
        提交表单后提示保存/更新登录</label
      >
      <button id="clear-never-save" disabled hidden>
        允许在此网站提示保存
      </button>
      <details>
        <summary>Passkey 设置</summary>
        <label
          ><input id="passkey-save" type="checkbox" /> 提供保存 Passkey</label
        ><label
          ><input id="passkey-use" type="checkbox" /> 提供 Passkey 登录</label
        >
      </details>
      <section id="generator-section" class="card">
        <h2>密码生成器</h2>
        <label
          >模式
          <select id="gen-mode">
            <option value="random">随机字符</option>
            <option value="memorable">易记词组</option>
            <option value="pin">PIN 码</option>
          </select>
        </label>
        <label
          >长度 <span id="gen-length-value">24</span>
          <input
            id="gen-length"
            type="range"
            min="16"
            max="64"
            value="24"
          />
        </label>
        <div id="gen-random-options">
          <label><input id="gen-digits" type="checkbox" /> 含数字</label>
          <label><input id="gen-symbols" type="checkbox" /> 含符号</label>
        </div>
        <div id="gen-memorable-options" hidden>
          <label
            ><input id="gen-capitalize" type="checkbox" /> 首字母大写</label
          >
          <label
            >分隔符
            <select id="gen-separator">
              <option value="hyphens">连字符 -</option>
              <option value="spaces">空格</option>
              <option value="periods">句点 .</option>
              <option value="commas">逗号 ,</option>
              <option value="underscores">下划线 _</option>
              <option value="numbers">数字</option>
              <option value="numbers-and-symbols">数字和符号</option>
            </select>
          </label>
        </div>
        <div class="preview">
          <code id="gen-preview" class="mono"></code
          ><span id="gen-entropy" class="badge"></span>
        </div>
        <div class="actions">
          <button id="gen-regenerate">生成密码</button
          ><button id="gen-fill" disabled>填充到当前页面</button
          ><button id="gen-copy" disabled>复制</button>
        </div>
        <p id="gen-status" class="note" role="status"></p>
        <details>
          <summary>已生成的密码</summary>
          <div id="gen-history"></div>
        </details>
      </section>
      <p id="status" role="status"></p>
      <p id="save-warning" class="note" role="alert"></p>
      <p id="origin"></p>
      <div id="candidates"></div>
      <p class="note">
        在原生窗口连接并启用快捷填充后，可直接在网页选择账号。自动登录只提交可明确识别的登录表单；Passkey
        需在原生窗口确认。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
