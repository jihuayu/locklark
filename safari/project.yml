name: LocklarkSafari
options:
  minimumXcodeGenVersion: "2.38.0"
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "$(LOCKLARK_TEAM_ID)"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  LocklarkSafari:
    type: application
    platform: macOS
    sources:
      - path: LocklarkSafari/Sources
      - path: Shared/Sources
      - path: LocklarkSafari/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Locklark
        PRODUCT_BUNDLE_IDENTIFIER: org.locklark.browser.safari
        INFOPLIST_FILE: LocklarkSafari/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocklarkSafari/LocklarkSafari.entitlements
        LOCKLARK_APP_BUNDLE_ID: org.locklark.browser.safari
        LOCKLARK_EXTENSION_BUNDLE_ID: org.locklark.browser.safari.Extension
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: LocklarkSafariExtension
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Embed fixed native helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../dist/locklark-browser-safari"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/locklark-browser-safari"
        script: |
          set -euo pipefail
          if [[ -n "${LOCKLARK_SAFARI_HELPER:-}" ]]; then
            export LOCKLARK_SAFARI_HELPER
          fi
          exec "$SRCROOT/scripts/embed_helper.sh"
  LocklarkSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: LocklarkSafariExtension/Sources
      - path: Shared/Sources
      - path: ../browser-extension/dist/safari
        buildPhase: resources
      - path: LocklarkSafariExtension/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: LocklarkSafariExtension
        PRODUCT_BUNDLE_IDENTIFIER: org.locklark.browser.safari.Extension
        INFOPLIST_FILE: LocklarkSafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocklarkSafariExtension/LocklarkSafariExtension.entitlements
        LOCKLARK_APP_BUNDLE_ID: org.locklark.browser.safari
        LOCKLARK_EXTENSION_BUNDLE_ID: org.locklark.browser.safari.Extension
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  LocklarkSafari:
    build:
      targets:
        LocklarkSafari: all
    run:
      config: Debug
    archive:
      config: Release
