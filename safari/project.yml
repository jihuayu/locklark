name: PassmeSafari
options:
  minimumXcodeGenVersion: "2.38.0"
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "$(PASSME_TEAM_ID)"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  PassmeSafari:
    type: application
    platform: macOS
    sources:
      - path: PassmeSafari/Sources
      - path: Shared/Sources
      - path: PassmeSafari/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Passme
        PRODUCT_BUNDLE_IDENTIFIER: org.passme.browser.safari
        INFOPLIST_FILE: PassmeSafari/Info.plist
        CODE_SIGN_ENTITLEMENTS: PassmeSafari/PassmeSafari.entitlements
        PASSME_APP_BUNDLE_ID: org.passme.browser.safari
        PASSME_EXTENSION_BUNDLE_ID: org.passme.browser.safari.Extension
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: PassmeSafariExtension
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Embed fixed native helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../dist/passme-browser-safari"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/passme-browser-safari"
        script: |
          set -euo pipefail
          if [[ -n "${PASSME_SAFARI_HELPER:-}" ]]; then
            export PASSME_SAFARI_HELPER
          fi
          exec "$SRCROOT/scripts/embed_helper.sh"
  PassmeSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PassmeSafariExtension/Sources
      - path: Shared/Sources
      - path: ../browser-extension/dist/safari
        buildPhase: resources
      - path: PassmeSafariExtension/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: PassmeSafariExtension
        PRODUCT_BUNDLE_IDENTIFIER: org.passme.browser.safari.Extension
        INFOPLIST_FILE: PassmeSafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PassmeSafariExtension/PassmeSafariExtension.entitlements
        PASSME_APP_BUNDLE_ID: org.passme.browser.safari
        PASSME_EXTENSION_BUNDLE_ID: org.passme.browser.safari.Extension
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  PassmeSafari:
    build:
      targets:
        PassmeSafari: all
    run:
      config: Debug
    archive:
      config: Release
